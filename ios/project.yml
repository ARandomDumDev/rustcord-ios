name: Rustcord
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Rustcord:
    type: application
    platform: iOS
    sources: [Rustcord]
    info:
      path: Rustcord/Info.plist
      properties:
        CFBundleDisplayName: Rustcord
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes: [rustcord]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rustcord.app
        SWIFT_OBJC_BRIDGING_HEADER: Rustcord-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)
        OTHER_LDFLAGS: [-lrustcord, -lresolv]
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../target/aarch64-apple-ios-sim/release
          "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../target/aarch64-apple-ios/release
        Debug:
          "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../target/aarch64-apple-ios-sim/release
          "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../target/aarch64-apple-ios/release
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: AuthenticationServices.framework
